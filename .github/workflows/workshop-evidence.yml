name: Workshop evidence

# Entorno de prueba aislado: no utiliza Powerstation ni otros hosts del HomeLab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observabilidad:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Preparar navegador para capturas del taller
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Levantar el stack desde cero
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Ejecutar ejercicios y recopilar evidencias reales
        run: python tools/workshop_evidence.py --output evidence/runtime
      - name: Conservar diagnóstico del stack
        if: always()
        run: |
          mkdir -p evidence/runtime
          docker compose ps --all --format json > evidence/runtime/compose-status.json
          docker compose logs --no-color > evidence/runtime/compose.log
      - name: Publicar evidencias de esta ejecución
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workshop-evidence
          path: evidence/runtime/
          retention-days: 7
      - name: Apagar el entorno de prueba del runner
        if: always()
        run: docker compose down --remove-orphans
